<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ede0f4"/>
      <stop offset="100%" stop-color="#c8a2d8"/>
    </linearGradient>
    <linearGradient id="sign" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a987c9"/>
      <stop offset="100%" stop-color="#5b2a86"/>
    </linearGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#sky)"/>
  <!-- Building -->
  <rect x="40" y="120" width="720" height="800" fill="#3e1c5a" opacity="0.15"/>
  <!-- Storefront sign -->
  <rect x="80" y="200" width="640" height="220" rx="8" fill="url(#sign)" stroke="#fff" stroke-width="3"/>
  <!-- Tooth icon -->
  <g transform="translate(160, 220)">
    <path d="M70 10c-15 0-26 7-35 7-6 0-9-2-9-2s-2 14 5 32c4 9 7 13 11 26 4 11 7 31 15 31 5 0 7-13 7-25 0-5 2-9 5-9s5 4 5 9c0 12 2 25 7 25 8 0 11-20 15-31 4-13 7-17 11-26 7-18 5-32 5-32s-3 2-9 2c-9 0-20-7-35-7z" fill="#fff"/>
    <path d="M70 30c-7 0-13 3-18 3-3 0-5-1-5-1s-1 7 3 16c2 4 4 6 6 13 2 5 4 16 8 16 3 0 4-6 4-13 0-2 2-5 4-5s4 3 4 5c0 7 1 13 4 13 4 0 6-11 8-16 2-7 4-9 6-13 4-9 3-16 3-16s-2 1-5 1c-5 0-11-3-18-3z" fill="#5b2a86"/>
  </g>
  <text x="420" y="330" font-family="Inter, sans-serif" font-size="80" font-weight="700" fill="#fff" text-anchor="middle">AURA</text>
  <text x="420" y="380" font-family="Inter, sans-serif" font-size="36" font-weight="600" fill="#fff" text-anchor="middle">Dental Care</text>
  <!-- Glass storefront -->
  <rect x="80" y="500" width="300" height="320" fill="#1a0f2e" opacity="0.6" stroke="#fff" stroke-width="2"/>
  <rect x="100" y="520" width="80" height="280" fill="#5b2a86" opacity="0.4"/>
  <rect x="200" y="520" width="80" height="280" fill="#c2185b" opacity="0.3"/>
  <rect x="300" y="520" width="60" height="280" fill="#5b2a86" opacity="0.4"/>
  <!-- Door -->
  <rect x="420" y="500" width="300" height="320" fill="#fff" stroke="#c8a2d8" stroke-width="2"/>
  <text x="570" y="640" font-family="Georgia, serif" font-size="28" fill="#5b2a86" text-anchor="middle">Asco Plaza</text>
  <text x="570" y="680" font-family="Georgia, serif" font-size="22" fill="#c2185b" text-anchor="middle">East Ottapalam</text>
  <!-- Balloons -->
  <circle cx="180" cy="440" r="14" fill="#c2185b" opacity="0.7"/>
  <circle cx="200" cy="455" r="12" fill="#fff" opacity="0.85"/>
  <circle cx="218" cy="445" r="13" fill="#a987c9" opacity="0.8"/>
  <circle cx="640" cy="440" r="14" fill="#a987c9" opacity="0.8"/>
  <circle cx="660" cy="455" r="12" fill="#fff" opacity="0.85"/>
  <!-- Sidewalk -->
  <rect x="0" y="900" width="800" height="100" fill="#3e1c5a" opacity="0.25"/>
  <text x="400" y="970" font-family="Georgia, serif" font-size="18" fill="#fff" text-anchor="middle" opacity="0.7">aura · storefront</text>
